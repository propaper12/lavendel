  <style>
    :root {
      --ink: #122031;
      --dusk: #3d5368;
      --mist: #eef3f8;
      --blue: #2f6fad;
      --blue-mid: #5a9fd4;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Outfit", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 90% 50% at 50% -10%, rgba(90, 159, 212, 0.28) 0%, transparent 55%),
        linear-gradient(180deg, #f4f8fc 0%, var(--mist) 40%, #dceaf6 100%);
      min-height: 100svh;
      line-height: 1.5;
    }
    body.is-locked { overflow: hidden; }
    .top {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: max(0.85rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) 0.85rem max(1rem, env(safe-area-inset-left));
      background: rgba(244, 248, 252, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(47, 111, 173, 0.12);
    }
    .top a {
      color: var(--blue);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .top h1 {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-weight: 600;
      font-size: clamp(1.5rem, 5vw, 2rem);
    }
    .wrap {
      max-width: 56rem;
      margin: 0 auto;
      padding: 1.25rem max(1rem, env(safe-area-inset-left)) max(2.5rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-right));
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.55rem;
    }
    @media (min-width: 720px) {
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.75rem; }
    }
    .g-item {
      display: block;
      width: 100%;
      padding: 0;
      border: none;
      background: #d5e6f4;
      border-radius: 3px;
      overflow: hidden;
      cursor: pointer;
      aspect-ratio: 3 / 4;
    }
    .g-item:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .g-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.45s var(--ease);
    }
    .g-item:hover img { transform: scale(1.03); }
    .lb {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: rgba(18, 32, 49, 0.72);
      backdrop-filter: blur(10px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s var(--ease), visibility 0.3s;
    }
    .lb.is-open { opacity: 1; visibility: visible; }
    .lb__card {
      position: relative;
      width: min(96vw, 720px);
      background: rgba(255,255,255,0.94);
      padding: 0.65rem;
      box-shadow: 0 24px 60px rgba(18,32,49,0.35);
    }
    .lb__card img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 82svh;
      object-fit: contain;
      background: #e8f0f8;
    }
    .lb__close {
      position: absolute;
      top: 0.45rem;
      right: 0.45rem;
      width: 2.4rem;
      height: 2.4rem;
      border: none;
      border-radius: 2px;
      background: rgba(255,255,255,0.92);
      font-size: 1.25rem;
      cursor: pointer;
      color: var(--ink);
    }
    .lb__nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 2.4rem;
      height: 2.4rem;
      border: none;
      border-radius: 2px;
      background: rgba(255,255,255,0.9);
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--ink);
    }
    .lb__prev { left: 0.45rem; }

  <div class="lb" id="lb" hidden>
    <div class="lb__card">
      <button type="button" class="lb__close" id="lb-close" aria-label="Kapat">×</button>
      <button type="button" class="lb__nav lb__prev" id="lb-prev" aria-label="Önceki">‹</button>
      <button type="button" class="lb__nav lb__next" id="lb-next" aria-label="Sonraki">›</button>
      <img id="lb-img" src="" alt="" />
    </div>
  </div>
  <script>
    const items = [...document.querySelectorAll(".g-item")];
    const lb = document.getElementById("lb");
    const lbImg = document.getElementById("lb-img");
    let idx = 0;
    function openAt(i) {
      idx = i;
      lbImg.src = items[idx].dataset.src;
      lb.hidden = false;
      requestAnimationFrame(() => lb.classList.add("is-open"));
      document.body.classList.add("is-locked");
    }
    function closeLb() {
      lb.classList.remove("is-open");
      const done = () => {
        lb.hidden = true;
        document.body.classList.remove("is-locked");
        lb.removeEventListener("transitionend", done);
      };
      lb.addEventListener("transitionend", done);
    }
    function step(d) {
      idx = (idx + d + items.length) % items.length;
      lbImg.src = items[idx].dataset.src;
    }
    items.forEach((el, i) => el.addEventListener("click", () => openAt(i)));
    document.getElementById("lb-close").addEventListener("click", (e) => { e.stopPropagation(); closeLb(); });
    document.getElementById("lb-prev").addEventListener("click", (e) => { e.stopPropagation(); step(-1); });
    document.getElementById("lb-next").addEventListener("click", (e) => { e.stopPropagation(); step(1); });
    lb.addEventListener("click", (e) => { if (e.target === lb) closeLb(); });
    window.addEventListener("keydown", (e) => {
      if (lb.hidden) return;
      if (e.key === "Escape") closeLb();
      if (e.key === "ArrowLeft") step(-1);
      if (e.key === "ArrowRight") step(1);
    });
  </script>
